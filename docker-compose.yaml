services:
  bot:
    env_file:
      - .env
    build: 
      context: ./bot
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - bot_network
    environment:
      - POSTGRES_HOST=db

  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
    - db_data:/var/lib/postgresql/data
    - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
    - bot_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}





volumes:
  db_data:

networks:
  bot_network:
    driver: bridge
